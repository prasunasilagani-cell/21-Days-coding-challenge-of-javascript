<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-columns: repeat(3,1fr);
        }
    </style>
</head>
<body>
    <div>
        <h1>Checking number is strong number or not</h1>
        <label for="">Enter the number:</label>
        <input type="text" id="n1"><br>
        <label for="">Result:</label>
        <input type="text" id="res1" size="30" readonly><br><br>
        <button onclick="strong()">Check</button>
        <script>
           function strong(){
            let  n1=parseInt(document.getElementById("n1").value)
temp=n1
sum2=0
while(n1>0){
    digit=n1%10
    fact=1
    for(i=1;i<=digit;i++){
        fact*=i
    }
    sum2+=fact
    n1=parseInt(n1/10)
}
if(sum2==temp){
    document.getElementById("res1").value="Given no. "+temp+" is strong number"
}
else{
     document.getElementById("res1").value="Given no. "+temp+" is not a strong number"
}
}
        </script>
    </div>
    <div>
        <h1>Checking number is perfect number or not</h1>
        <label for="">Enter the number:</label>
        <input type="text" id="n2"><br>
        <label for="">Result:</label>
        <input type="text" id="res2" size="30" readonly><br><br>
        <button onclick="perfect()">Check</button>
        <script>
            function perfect(){
                let n2=parseInt(document.getElementById("n2").value)
let add=0
for(let i=1;i<n2;i++){
    if(n2%i==0){
        add+=i
    }
}
if(add==n2){
    document.getElementById("res2").value="The given no. "+n2+" is perfect number."
}
else{
     document.getElementById("res2").value="The given no. "+n2+" is not a perfect number."
}
}
        </script>
    </div>
    <div>
         <h1>Checking number is palindrome number or not</h1>
        <label for="">Enter the number:</label>
        <input type="text" id="n3"><br>
        <label for="">Result:</label>
        <input type="text" id="res3" size="30" readonly><br><br>
        <button onclick="palindrome()">Check</button>
        <script>
            let  palindrome=()=>{
                let num=parseInt(document.getElementById("n3").value)
temp1=num
rev=0
while(num>0){
    digit=num%10
    rev=rev*10+digit
    num=parseInt(num/10)
}
if(rev==temp1){
   document.getElementById("res3").value="The givn no. "+temp1+" is a palindrome."
}
else{
     document.getElementById("res3").value="The givn no. "+temp1+" is not a palindrome."
}
}
        </script>
    </div>
    <div>
         <h1>Checking number is Armstrong number or not</h1>
        <label for="">Enter the number:</label>
        <input type="text" id="n4"><br>
        <label for="">Result:</label>
        <input type="text" id="res4" size="30" readonly><br><br>
        <button onclick="Armstrong()">Check</button>
        <script>
         let Armstrong=()=>{
let n=parseInt(document.getElementById("n4").value)
temp=n
sum1=0
while(n>0){
    digit=n%10
    sum1+=digit**3 
    n=parseInt(n/10)
}
if(sum1==temp){
    document.getElementById("res4").value="The given no."+temp+" is a Armstrong number."
}
else{
     document.getElementById("res4").value="The given no."+temp+" is a Armstrong number."
}
}
        </script>
    </div>
    <div>
         <h1>Checking number is Neon number or not</h1>
        <label for="">Enter the number:</label>
        <input type="text" id="n5"><br>
        <label for="">Result:</label>
        <input type="text" id="res5" size="30" readonly><br><br>
        <button onclick="Neon()">Check</button>
        <script>
           let Neon=function(){
n=parseInt(document.getElementById("n5").value)
sqr_num=n**2
sum2=0
while(sqr_num>0){
    digit=sqr_num%10
    sum2+=digit
    sqr_num=parseInt(sqr_num/10)
}
if(sum2==n){
   document.getElementById("res5").value="The given no."+n+" is a neon number"
}
else{
      document.getElementById("res5").value="The given no."+n+" is not a neon number"
}
}
        </script>
    </div>
    <div>
         <h1>Reversing the number</h1>
        <label for="">Enter the number:</label>
        <input type="text" id="n6"><br>
        <label for="">Result:</label>
        <input type="text" id="res6" size="30" readonly><br><br>
        <button onclick="Reverse()">Check</button>
        <script>
        let Reverse=function(){
            let n=parseInt(document.getElementById("n6").value)
rev=0
while(n>0){
    digit=n%10
    rev=rev*10+digit
    n=parseInt(n/10)
}
document.getElementById("res6").value="The reverse of a number is "+rev
}
        </script>
    </div>
</body>
</html>
